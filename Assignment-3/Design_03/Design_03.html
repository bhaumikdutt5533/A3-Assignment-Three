<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Design_03.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <nav>
        <img src="./Photos/squid_game_logo.png" alt="squid_game" />
        <div class="nav-links">
          <h3>About</h3>
          <h3>Watch now</h3>
          <h3>Actors</h3>
          <h3>Contact</h3>
        </div>
        <h4><i class="ri-menu-3-fill"></i></h4>
      </nav>

      <div class="hero-section">
        <div class="hero-texts">
          <img src="./Photos/head_logo.png" alt="squid_game" />
          <p>Action / Thriller / Drama Series directed by Dong-hyuk Hwang</p>
          <p>Season 1: 9 Episodes</p>
          <div class="buttons">
            <button class="btn1">
              <h4><i class="ri-play-circle-fill"></i></h4>
              Play Now
            </button>
            <button class="btn2">
              <h4><i class="ri-play-line"></i></h4>
              Watch Trailer
            </button>
          </div>
        </div>
        <div class="hero-img">
          <img src="./Photos/men2.png" alt="" />
        </div>

        <div class="links">
          <div class="twitter">
            <h3><i class="ri-twitter-line"></i></h3>
          </div>
          <div class="insta">
            <h3><i class="ri-instagram-line"></i></h3>
          </div>
          <div class="facebook">
            <h3><i class="ri-facebook-fill"></i></h3>
          </div>
        </div>
      </div>

      <div class="videos">
        <div class="videos_prev1">
          <img src="./Photos/img1.jpg" alt="" />
          <div class="play-button1">
            <h3><i class="ri-play-large-line"></i></h3>
          </div>
        </div>
        <div class="videos_prev2">
          <img src="./Photos/img2.webp" alt="" />
          <div class="play-button2">
            <h3><i class="ri-play-large-line"></i></h3>
          </div>
        </div>
        <div class="videos_prev3">
          <img src="./Photos/img3.jpg.webp" alt="" />
          <div class="play-button3">
            <h3><i class="ri-play-large-line"></i></h3>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
